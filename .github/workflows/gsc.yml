name: GSC daily eyes
on:
  schedule:
    - cron: '30 2 * * *'   # daily ~8am IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q google-auth requests
      - env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          python scripts/gsc_bootstrap.py
          python scripts/gsc_report.py
      - run: |
          git config user.name "gsc-bot"; git config user.email "bot@udyoggrowth.com"
          git add -A && git diff --cached --quiet || git commit -m "GSC daily report [skip ci]"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejected (likely a race with another commit) — retrying $i/5"
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 5))
          done
