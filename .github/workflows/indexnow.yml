name: IndexNow ping
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # weekly Monday refresh
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Refresh sitemap lastmod from git history
        continue-on-error: true
        run: |
          python3 scripts/sitemap_freshness.py
          git config user.name "freshness-bot"; git config user.email "bot@udyoggrowth.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "sitemap: lastmod from git"
            git pull --rebase origin main
            git push
          fi
      - name: Submit sitemap URLs to IndexNow
        if: always()
        run: |
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<[^>]*>//g' | sed 's/.*/"&"/' | paste -sd, -)
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"udyoggrowth.com\",\"key\":\"8fcb58d71e63467db0bcc05b3e7790f5\",\"keyLocation\":\"https://udyoggrowth.com/8fcb58d71e63467db0bcc05b3e7790f5.txt\",\"urlList\":[$URLS]}" -o /dev/null -w "IndexNow HTTP %{http_code}\n"
