name: Keyword intelligence (free autosuggest + SERP)
on:
  workflow_dispatch:
    inputs:
      suggest_budget_min: { description: 'Autosuggest time budget (minutes)', default: '30' }
      serp_max:           { description: 'Max SERP lookups', default: '200' }
      serp_budget_min:    { description: 'SERP time budget (minutes)', default: '45' }
  schedule:
    - cron: '30 21 * * 6'   # Sunday 03:00 IST
permissions:
  contents: write
concurrency:
  group: keyword-intel
  cancel-in-progress: false
jobs:
  intel:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q ddgs beautifulsoup4 lxml
      - name: Run keyword intelligence
        timeout-minutes: 120
        env:
          SUGGEST_BUDGET_MIN: ${{ github.event.inputs.suggest_budget_min || '35' }}
          SERP_MAX: ${{ github.event.inputs.serp_max || '200' }}
          SERP_BUDGET_MIN: ${{ github.event.inputs.serp_budget_min || '45' }}
        run: python scripts/keyword_intel.py
      - name: Upload full detail (private artifact — contains competitor domains)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-intel-full
          path: intel/
          retention-days: 60
          if-no-files-found: ignore
      - name: Diagnose outputs
        if: always()
        run: |
          echo "::notice title=seo-files::$(ls -la seo 2>&1 | tr '\n' '|')"
          echo "::notice title=intel-files::$(ls -la intel 2>&1 | tr '\n' '|')"
          echo "::notice title=git-status::$(git status --short 2>&1 | head -15 | tr '\n' '|')"
      - name: Commit sanitised report (retry on race)
        if: always()
        run: |
          set +e
          git config user.name "intel-bot"; git config user.email "intel-bot@users.noreply.github.com"
          OUT=$(git add -f seo/keyword-intel.json seo/keyword-intel.md 2>&1); RC=$?
          echo "::notice title=git-add::rc=$RC $(echo "$OUT" | tr '\n' '|')"
          [ $RC -ne 0 ] && exit 1
          git commit -m "keyword-intel: $(date -u +%F) sanitised report" >/dev/null 2>&1 || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5 6; do
            OUT=$(git fetch origin main 2>&1); echo "::notice title=fetch-$i::rc=$? $(echo "$OUT" | tr '\n' '|' | cut -c1-200)"
            OUT=$(git rebase -X theirs origin/main 2>&1); RC=$?
            echo "::notice title=rebase-$i::rc=$RC $(echo "$OUT" | tr '\n' '|' | cut -c1-300)"
            if [ $RC -ne 0 ]; then git rebase --abort; exit 1; fi
            OUT=$(git push origin main 2>&1); RC=$?
            echo "::notice title=push-$i::rc=$RC $(echo "$OUT" | tr '\n' '|' | cut -c1-300)"
            [ $RC -eq 0 ] && exit 0
            sleep $((RANDOM % 25 + 5))
          done
          exit 1
      - name: Summary
        if: always()
        run: head -60 seo/keyword-intel.md >> "$GITHUB_STEP_SUMMARY" || true
