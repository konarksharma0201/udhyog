name: SERP tracker (daily)
on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: serp
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q ddgs beautifulsoup4 lxml
      - name: Run tracker
        timeout-minutes: 105
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERP_PANEL_SIZE: '8'
          SERP_BUDGET_MIN: '95'
        run: python scripts/serp_tracker.py
      - name: Competitor audit + keyword universe
        if: always()
        timeout-minutes: 40
        env: { AUDIT_BUDGET_MIN: '30', AUDIT_MAX_FETCH: '220' }
        run: python scripts/competitor_audit.py || echo "audit failed; continuing"
      - name: Commit report (retry on race)
        if: always()
        run: |
          git config user.name "serp-bot"; git config user.email "serp-bot@users.noreply.github.com"
          git add reports/serp reports/serp-status.md reports/competitors reports/competitor-gaps.md reports/keyword-universe.json
          git commit -m "serp: $(date -u +%F) report" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
      - name: Summary
        if: always()
        run: cat reports/serp-status.md >> "$GITHUB_STEP_SUMMARY"
